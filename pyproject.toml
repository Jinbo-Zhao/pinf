[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plausible-inference"
version = "0.1.0"
description = "Plausible inference models with Pyomo (screening, intervals, pixelization, structural feasibility)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["optimization", "pyomo", "plausible inference"]
dependencies = [
    "numpy>=1.22",
    "pyomo>=6.6",
    "scipy>=1.9",
]

[project.optional-dependencies]
gui = [
    "matplotlib>=3.6",
    "pandas>=1.5",
    "streamlit>=1.28",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "pandas>=1.5",
]
solvers = [
    "gurobipy>=10.0",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autoapi>=3.0",
    "myst-nb>=1.0",
]

[project.urls]
Homepage = "https://github.com/Jinbo-Zhao/pinf"
Documentation = "https://pinf.readthedocs.io/en/latest/"
Repository = "https://github.com/Jinbo-Zhao/pinf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
